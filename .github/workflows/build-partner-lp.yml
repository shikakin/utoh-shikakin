name: Build Partner Clinic LPs

on:
  push:
    branches: [main]
    paths:
      - 'lp-automation/clinics/**/clinic.json'
      - 'lp-automation/build_lp.py'
      - 'lp-automation/validate_lp.py'
      - '.github/workflows/build-partner-lp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependency
        run: python -m pip install --quiet Pillow

      - name: Build and validate every clinic
        shell: bash
        run: |
          set -euo pipefail
          for cfg in lp-automation/clinics/*/clinic.json; do
            slug="$(basename "$(dirname "$cfg")")"
            echo "=== BUILD $slug ==="
            python lp-automation/build_lp.py \
              --source utoh_shikakin_lp_embedded.html \
              --config "$cfg" \
              --output "$slug/index.html"
            python lp-automation/validate_lp.py \
              --dir "$slug" \
              --config "$cfg"
          done

      - name: Commit generated LPs
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'shikakin-lp-bot'
          git config user.email 'info@shikakin.jp'
          git add -- '*/index.html'
          git commit -m 'Auto-build partner clinic LPs'
          git push
